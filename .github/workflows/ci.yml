name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint + typography)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build the Swift helper
        run: node scripts/build-helper.mjs

      - name: Unit, integration, worker, script and Swift tests
        run: pnpm test

      - name: Build packages, extension and app bundles
        run: pnpm build
