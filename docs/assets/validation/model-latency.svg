<text class="ax" x="232" y="324">Dot marks p90. The reference pass had the server to itself; the thinking-on pass shared it, which inflates</text><text class="ax" x="232" y="340">its upper tail. Latency is prefill-bound: about 1,800 image tokens at 220-400 tok/s, generation at 32 tok/s.</text>
<text class="s" x="32" y="434">Source: grounding/report-thinking-off-temp0.2-clean.json and report-thinking-on-temp1.0.json, outcomes[].latencyMs.</text>
