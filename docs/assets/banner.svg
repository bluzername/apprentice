<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Apprentice</title>
  <desc id="desc">A local-first, self-learning work agent for Apple Silicon Macs</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glow)"/>
  <g transform="translate(70,90)">
    <circle cx="40" cy="70" r="34" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <circle cx="40" cy="70" r="12" fill="url(#accent)"/>
    <path d="M40 4 L48 36 L32 36 Z" fill="#2dd4bf"/>
    <path d="M40 136 L32 104 L48 104 Z" fill="#f59e0b"/>
    <path d="M-26 70 L6 62 L6 78 Z" fill="#7c5cff"/>
    <path d="M106 70 L74 62 L74 78 Z" fill="#7c5cff"/>
  </g>
  <text x="220" y="140" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#f8fafc" letter-spacing="-2">Apprentice</text>
  <text x="224" y="190" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#cbd5e1">A local-first, self-learning work agent for your Mac.</text>
  <text x="224" y="232" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">Watches what you allow. Learns your routines. Asks before every click.</text>
  <rect x="224" y="262" width="720" height="6" rx="3" fill="url(#accent)"/>
</svg>
